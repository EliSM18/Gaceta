<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ingreso Noticias</title>
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="pagina-formulario">
        <header class="encabezado">
            <div class="encabezado-franja">
                <div class="contenedor">
                    <span class="punto-dorado"></span>
                    <span class="cintillo">Órgano Oficial de Difusión Universitaria</span>
                </div>
            </div>
            <div class="contenedor encabezado-marca">
                <img src="logo.png" alt="Logo de la Universidad de la Sierra Sur" />
                <div>
                    <span class="cintillo">Universidad de la Sierra Sur</span>
                    <a href="index.html" class="encabezado-titulo">GACETA UNSIS</a>
                </div>
            </div>
        </header>

        <main>
            <div class="contenedor">
                <div class="tarjeta">
                    <div class="tarjeta-cabecera">
                        <span class="cintillo">Redacción</span>
                        <h1>Ingreso de noticias</h1>
                        <p>Completa los campos para publicar una nueva noticia en la Gaceta.</p>
                    </div>

                    <form class="formulario">
                        <div class="campo">
                            <label for="titulo_noticia">Título</label>
                            <input type="text" id="titulo_noticia" name="titulo" required
                                placeholder="Escribe el título de la noticia">
                        </div>

                        <div class="campo">
                            <label for="detalle_noticia">Detalle</label>
                            <textarea id="detalle_noticia" name="detalle" required rows="8"
                                placeholder="Redacta el contenido de la noticia"></textarea>
                        </div>

                        <div class="campo">
                            <label for="fecha_noticia">Fecha</label>
                            <input type="date" id="fecha_noticia" name="fecha" required>
                        </div>

                        <div class="campo">
                            <label for="imagen">Imagen <span class="opcional">(opcional)</span></label>
                            <label class="campo-imagen">
                                <span class="material-symbols-outlined">add_photo_alternate</span>
                                <span class="texto-imagen" id="texto-imagen">Selecciona una imagen</span>
                                <span class="ayuda-imagen">La imagen se agregará posteriormente</span>
                                <input type="file" id="imagen" name="imagen" accept="image/png, image/jpeg, image/webp">
                            </label>
                            <img id="vista-previa" class="vista-previa" alt="Vista previa de la imagen seleccionada">
                        </div>

                        <div class="acciones">
                            <a href="index.html" class="boton-secundario">Cancelar</a>
                            <button type="submit" class="boton-principal">
                                <span class="material-symbols-outlined">send</span>
                                Enviar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="pie">
            <div class="contenedor">
                © 2024 Universidad de la Sierra Sur. Todos los derechos reservados. SUNEO.
            </div>
        </footer>
        <script>
            const API_URL = "https://3qxxmb2oa6sxoprodflp47cmb40hmich.lambda-url.us-east-2.on.aws/";
            const ENDPOINT_URL_FIRMADA = "https://wutbn6erqbcvm2ppksn6pmgiyy0fdtcw.lambda-url.us-east-2.on.aws/";
            const inputImagen = document.getElementById("imagen");
            const vistaPrevia = document.getElementById("vista-previa");
            const textoImagen = document.getElementById("texto-imagen");

            const formulario = document.querySelector(".formulario");

            formulario.addEventListener("submit", async (event) => {
                event.preventDefault();

                const botonEnviar = formulario.querySelector('button[type="submit"]');
                const archivo = inputImagen.files[0];
                let imagenNoticia = null;

                botonEnviar.disabled = true;

                try {
                    if (archivo) {
                        botonEnviar.textContent = "Preparando imagen...";

                        const parametros = new URLSearchParams({ file: archivo.name });
                        const respuestaUrl = await fetch(
                            `${ENDPOINT_URL_FIRMADA}?${parametros.toString()}`
                        );

                        if (!respuestaUrl.ok) {
                            const errorTexto = await respuestaUrl.text();
                            throw new Error(
                                `Error al generar URL (${respuestaUrl.status}): ${errorTexto}`
                            );
                        }

                        const { uploadUrl, imageUrl, contentType } = await respuestaUrl.json();

                        if (!uploadUrl || !imageUrl) {
                            throw new Error("La Lambda no devolvió la URL o la clave de la imagen");
                        }

                        botonEnviar.textContent = "Subiendo imagen...";
                        const respuestaS3 = await fetch(uploadUrl, {
                            method: "PUT",
                            headers: {
                                "Content-Type": contentType || archivo.type,
                            },
                            body: archivo,
                        });

                        if (!respuestaS3.ok) {
                            throw new Error(
                                `Error al subir la imagen a S3 (${respuestaS3.status})`
                            );
                        }

                        imagenNoticia = imageUrl;
                    }

                    botonEnviar.textContent = "Enviando...";
                    const datosNoticia = {
                        titulo_noticia: document.getElementById("titulo_noticia").value.trim(),
                        detalle_noticia: document.getElementById("detalle_noticia").value.trim(),
                        fecha_noticia: document.getElementById("fecha_noticia").value,
                        imagen_noticia: imagenNoticia,
                    };

                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(datosNoticia),
                    });

                    if (!response.ok) {
                        throw new Error(`Error HTTP al guardar la noticia: ${response.status}`);
                    }

                    alert("Noticia enviada correctamente.");
                    formulario.reset();
                    vistaPrevia.classList.remove("visible");
                    vistaPrevia.removeAttribute("src");
                    textoImagen.textContent = "Selecciona una imagen";
                } catch (error) {
                    console.error("Error al enviar la noticia:", error);
                    alert(`Error al enviar la noticia. ${error.message}`);
                } finally {
                    botonEnviar.disabled = false;
                    botonEnviar.textContent = "Enviar";
                }
            });

            inputImagen.addEventListener("change", () => {
                const archivo = inputImagen.files[0];

                if (!archivo) {
                    vistaPrevia.classList.remove("visible");
                    vistaPrevia.removeAttribute("src");
                    textoImagen.textContent = "Selecciona una imagen";
                    return;
                }

                vistaPrevia.src = URL.createObjectURL(archivo);
                vistaPrevia.classList.add("visible");
                textoImagen.textContent = archivo.name;
            });
        </script>
    </body>
</html>
